locale: "en-US"
site_theme: "default"
title: "Leo Maynard-Zhang"
title_separator: "-"
name: "Leo Maynard-Zhang"
description: "Academic website for Leo Maynard-Zhang"
url: "https://leomayn.github.io"
baseurl: ""
repository: "leomayn/leomayn.github.io"

author:
  avatar: "leo.jpg"
  name: "Leo Maynard-Zhang"
  bio: "Undergraduate, Paul G. Allen School of Computer Science & Engineering"
  location: "University of Washington"
  employer:
  uri:
  email:
  email_text: "leomayn [at] cs (dot) washington (dot) edu"
  github: "leomayn"
  linkedin:
  arxiv:
  googlescholar: "https://scholar.google.com/citations?hl=en&user=m3CcYVkAAAAJ"
  orcid:
  semantic:
  twitter:

teaser:
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false

comments:
  provider:

atom_feed:
  hide: false
  path:

analytics:
  provider: "false"

include:
  - _pages
  - files

exclude:
  - academicpages-template
  - node_modules
  - vendor
  - README-template.md
  - Dockerfile
  - docker-compose.yaml
  - package.json*

keep_files:
  - .git

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: America/Los_Angeles

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
